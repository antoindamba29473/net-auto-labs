# topology.yml
#
# ============================================================
# CISCO IOS-XE EVPN/VXLAN LAB
# ============================================================
#
# Goals:
#
# 1. L2VNI
#    Same VLAN + same subnet on different leafs.
#
#    H-100-10-7-L1 ---- L1 ===== VXLAN ===== L2 ---- H-100-10-8-L2
#    VLAN 100 / 172.16.10.0/24
#
#
# 2. L3VNI
#    Different VLANs/subnets in the same VRF.
#
#    H-100-10-7-L1 ---- L1
#                 \
#                  L3VNI / VRF-A
#                 /
#    H-102-12-7-L3 ---- L3
#
#    VLAN 100 -> 172.16.10.0/24
#    VLAN 102 -> 172.16.12.0/24
#
#
# 3. Second VRF
#
#    VLAN 200 -> 172.16.20.0/24
#    VLAN 201 -> 172.16.21.0/24
#
#
# 4. External connectivity
#
#    customer-b
#          |
#         L4
#          |
#    static routes
#          |
#         EXT -- HE
#
#
# ============================================================

defaults.device: iol
defaults.devices.iol.clab.image: vrnetlab/cisco_iol:17.18.02
defaults.devices.ioll2.clab.image: vrnetlab/cisco_iol:l2-17.18.02
defaults.vlan.start_vlan_id: 100
defaults.paths.append.custom.dirs: [ /path/to/netlab/snippets ]
provider: clab

# ============================================================
# ADDRESSING
# ============================================================

addressing:

  mgmt:
    ipv4: 172.20.20.0/24

  p2p:
    ipv4: 10.200.0.0/16
    prefix: 30

# ============================================================
# BGP / FABRIC
# ============================================================

bgp.as: 65000

bgp.activate.ipv4: []

plugin:
- fabric

fabric.spines: 2
fabric.leafs: 4

# ============================================================
# NODES
# ============================================================

nodes:

  # ----------------------------------------------------------
  # SPINES
  # ----------------------------------------------------------

  S1:
    mgmt.ipv4: 172.20.20.100

  S2:
    mgmt.ipv4: 172.20.20.101

  # ----------------------------------------------------------
  # LEAFS
  # ----------------------------------------------------------

  L1:
    mgmt.ipv4: 172.20.20.110

  L2:
    mgmt.ipv4: 172.20.20.111

  L3:
    mgmt.ipv4: 172.20.20.112

  L4:
    mgmt.ipv4: 172.20.20.113

  # ----------------------------------------------------------
  # HOSTS (alphabetical mgmt IP assignment)
  # ----------------------------------------------------------

  H-100-10-7-L1:
    # customer-a, VLAN 100
    mgmt.ipv4: 172.20.20.120

  H-200-20-7-L3:
    # customer-b, VLAN 200
    mgmt.ipv4: 172.20.20.121

  H-100-10-8-L2:
    # customer-a, VLAN 100
    mgmt.ipv4: 172.20.20.122

  H-200-20-8-L4:
    # customer-b, VLAN 200
    mgmt.ipv4: 172.20.20.123

  HE:
    # behind EXT
    mgmt.ipv4: 172.20.20.124

  H-101-11-7-L1:
    # customer-a, VLAN 101
    mgmt.ipv4: 172.20.20.125

  H-102-12-7-L3:
    # customer-a, VLAN 102 -- repurposed from VLAN 101/L2
    # (forces true L3VNI: L3 has no other customer-a VLAN)
    mgmt.ipv4: 172.20.20.126

  H-201-21-7-L3:
    # customer-b, VLAN 201
    mgmt.ipv4: 172.20.20.127

  H-202-22-7-L1:
    # customer-b, VLAN 202 -- repurposed from VLAN 201/L4
    # (forces true L3VNI: L1 has no other customer-b VLAN)
    mgmt.ipv4: 172.20.20.128

  # ----------------------------------------------------------
  # EXTERNAL ROUTER
  # ----------------------------------------------------------

  EXT:
    mgmt.ipv4: 172.20.20.130

# ============================================================
# VRFs
# ============================================================

vrfs:

  customer-a:
    ospf: false

  customer-b:
    ospf: false

# ============================================================
# GROUPS
# ============================================================

groups:

  _auto_create: true

  # ----------------------------------------------------------
  # LEAFS
  # ----------------------------------------------------------

  leafs:

    module:
    - ospf
    - bgp
    - vlan
    - vrf

    device: ioll2

    config:
    - multicast_leaf
    - evpn_leaf

  # ----------------------------------------------------------
  # SPINES
  # ----------------------------------------------------------

  spines:

    module:
    - ospf
    - bgp

    bgp.rr: true

    config:
    - multicast_spine
    - evpn_spine

  # ----------------------------------------------------------
  # LINUX HOSTS
  # ----------------------------------------------------------

  hosts:

    members:
    - H-100-10-7-L1
    - H-200-20-7-L3
    - H-100-10-8-L2
    - H-200-20-8-L4
    - HE
    - H-101-11-7-L1
    - H-102-12-7-L3
    - H-201-21-7-L3
    - H-202-22-7-L1

    device: linux

    config:
    - ssh-enable

  # ----------------------------------------------------------
  # EXTERNAL ROUTER
  # ----------------------------------------------------------

  external:

    members:
    - EXT

    device: iol

# ============================================================
# VLAN / IRB
# ============================================================

vlan.mode: irb

# ============================================================
# CUSTOMER-A
# ============================================================
#
# VRF:
#   customer-a
#
# L3VNI:
#   10000
#
# VLAN 100:
#   L2VNI 10100
#   172.16.10.0/24
#
# VLAN 101:
#   L2VNI 10101
#   172.16.11.0/24
#
#
# L2VNI TEST
#
#     L1 ================= L2
#      |                    |
#   VLAN100              VLAN100
#      |                    |
# H-100-10-7-L1      H-100-10-8-L2
#
#
# L3VNI TEST (asymmetric IRB -- L1 has both VLANs locally)
#
#     L1 ================= L2
#      |                    |
#   VLAN100              VLAN101
#      |                    |
# H-100-10-7-L1      H-101-11-7-L1 (same box, local routing)
#
# TRUE L3VNI TEST (symmetric IRB -- L3 has no other customer-a VLAN)
#
#     L1                   L3
#      |                    |
#   VLAN100              VLAN102
#      |                    |
# H-100-10-7-L1      H-102-12-7-L3
#
# All VLANs are in customer-a.
#


vlans:

  # ----------------------------------------------------------
  # CUSTOMER-A VLAN 100
  # ----------------------------------------------------------

  orange:

    id: 100

    prefix: 172.16.10.0/24

    vrf: customer-a

    links:

    # L2VNI endpoint
    - H-100-10-7-L1:
        ipv4: 172.16.10.7/24
      L1:

        # L2VNI endpoint
    - H-100-10-8-L2:
        ipv4: 172.16.10.8/24
      L2:

        # ----------------------------------------------------------
        # CUSTOMER-A VLAN 101
        # ----------------------------------------------------------

  orange2:

    id: 101

    prefix: 172.16.11.0/24

    vrf: customer-a

    links:

    # Second subnet on L1
    - H-101-11-7-L1:
        ipv4: 172.16.11.7/24
      L1:

        # ----------------------------------------------------------
        # CUSTOMER-A VLAN 102 (only on L3 -- forces true L3VNI routing
        # to reach VLAN100/101 on L1/L2, since L3 has no local fallback)
        # ----------------------------------------------------------

  orange3:

    id: 102

    prefix: 172.16.12.0/24

    vrf: customer-a

    links:

    - H-102-12-7-L3:
        ipv4: 172.16.12.7/24
      L3:

        # ==========================================================
        # CUSTOMER-B
        # ==========================================================
        #
        # VRF:
        #   customer-b
        #
        # L3VNI:
        #   20000
        #
        # VLAN 200:
        #   L2VNI 10200
        #   172.16.20.0/24
        #
        # VLAN 201:
        #   L2VNI 10201
        #   172.16.21.0/24
        #
        #
        # L2VNI TEST
        #
        #     L3 ================= L4
        #      |                    |
        #   VLAN200              VLAN200
        #      |                    |
        # H-200-20-7-L3      H-200-20-8-L4
        #
        #
        # L3VNI TEST (asymmetric IRB -- L3 has both VLANs locally)
        #
        #     L3 ================= L4
        #      |                    |
        #   VLAN200              VLAN201
        #      |                    |
        # H-200-20-7-L3      H-201-21-7-L3 (same box, local routing)
        #
        # TRUE L3VNI TEST (symmetric IRB -- L1 has no other customer-b VLAN)
        #
        #     L3                   L1
        #      |                    |
        #   VLAN200              VLAN202
        #      |                    |
        # H-200-20-7-L3      H-202-22-7-L1
        #


        # ----------------------------------------------------------
        # CUSTOMER-B VLAN 200
        # ----------------------------------------------------------

  blue:

    id: 200

    prefix: 172.16.20.0/24

    vrf: customer-b

    links:

    # L2VNI endpoint
    - H-200-20-7-L3:
        ipv4: 172.16.20.7/24
      L3:

        # L2VNI endpoint
    - H-200-20-8-L4:
        ipv4: 172.16.20.8/24
      L4:

        # ----------------------------------------------------------
        # CUSTOMER-B VLAN 201
        # ----------------------------------------------------------

  blue2:

    id: 201

    prefix: 172.16.21.0/24

    vrf: customer-b

    links:

    # Second subnet on L3
    - H-201-21-7-L3:
        ipv4: 172.16.21.7/24
      L3:

        # ----------------------------------------------------------
        # CUSTOMER-B VLAN 202 (only on L1 -- forces true L3VNI routing
        # to reach VLAN200/201 on L3/L4, since L1 has no local fallback)
        # ----------------------------------------------------------

  blue3:

    id: 202

    prefix: 172.16.22.0/24

    vrf: customer-b

    links:

    - H-202-22-7-L1:
        ipv4: 172.16.22.7/24
      L1:

        # ============================================================
        # EXTERNAL ROUTED CONNECTION
        # ============================================================

links:

- L4:
    ipv4: 10.255.0.1/30
  EXT:
    ipv4: 10.255.0.2/30
  vrf: customer-b

- EXT:
    ipv4: 10.255.0.5/30
  HE:
    ipv4: 10.255.0.6/30

# ============================================================
# TOOLS
# ============================================================

tools:
  graphite:
